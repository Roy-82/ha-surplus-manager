name: Bootstrap repository

on:
  push:
    paths:
      - bootstrap.part3

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild prepared archive
        run: |
          cat bootstrap.part1 bootstrap.part2 bootstrap.part3 | base64 -d > bootstrap.zip

      - name: Unpack prepared integration
        run: |
          unzip -o bootstrap.zip
          rm -f bootstrap.zip bootstrap.part1 bootstrap.part2 bootstrap.part3
          rm -rf custom_components/surplus_manager/__pycache__

      - name: Commit unpacked repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Überschussmanager v2.1.0 [skip ci]"
          git push
